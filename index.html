            state.currentScreen = screen;
            render();
            window.scrollTo(0, 0);
        }

        function render() {
            const app = document.getElementById('app');
            app.innerHTML = '';

            switch(state.currentScreen) {
                case 'welcome':
                    app.innerHTML = renderWelcomeScreen();
                    break;
                case 'instructions':
                    app.innerHTML = renderInstructionsScreen();
                    break;
                case 'map':
                    app.innerHTML = renderMapScreen();
                    break;
                case 'material':
                    app.innerHTML = renderMaterialScreen();
                    break;
                case 'quiz':
                    app.innerHTML = renderQuizScreen();
                    break;
                case 'result':
                    app.innerHTML = renderResultScreen();
                    break;
                case 'certificate':
                    app.innerHTML = renderCertificateScreen();
                    break;
            }
        }

            div.className = "fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center z-50 p-4";
            div.innerHTML = `
                <div class="bg-white rounded-2xl p-6 max-w-sm w-full text-center shadow-2xl border-4 border-amber-400 animate-float">
                    <p class="text-lg font-bold text-amber-900 mb-4">${msg}</p>
                    <button onclick="this.parentElement.parentElement.remove()" class="bg-amber-500 hover:bg-amber-600 text-white font-bold py-2 px-6 rounded-xl shadow">Bener</button>
                </div>

                        <div onclick="openMaterial(1)" class="cursor-pointer bg-gradient-to-br from-amber-100 to-orange-100 border-2 border-amber-300 hover:border-orange-500 p-5 rounded-2xl shadow transition transform hover:-translate-y-1">

                            <div class="text-3xl mb-2">🤝</div>
                            <span class="text-xs font-bold bg-emerald-200 text-emerald-900 px-2 py-1 rounded-lg">LEVEL 2</span>
                            <h3 class="text-lg font-extrabold text-emerald-900 mt-2">UNGGAH-UNGGUH</h3>
                            <p class="text-xs text-slate-600 mt-1">Teks pahlawan, geguritan pahlawan, wicara, & nulis.</p>
                            <div class="mt-4 text-xs font-bold text-teal-600 flex items-center gap-1">📚 Sinau Materi &rarr;</div>
                        </div>

                        <!-- Level 3 -->
                        <div onclick="openMaterial(3)" class="cursor-pointer bg-gradient-to-br from-sky-100 to-blue-100 border-2 border-sky-300 hover:border-blue-500 p-5 rounded-2xl shadow transition transform hover:-translate-y-1">

                            <div class="mt-4 text-xs font-bold text-blue-600 flex items-center gap-1">📚 Sinau Materi &rarr;</div>

                        <div onclick="openMaterial(4)" class="cursor-pointer bg-gradient-to-br from-purple-100 to-pink-100 border-2 border-purple-300 hover:border-pink-500 p-5 rounded-2xl shadow transition transform hover:-translate-y-1">
                            <div class="text-3xl mb-2">📜</div>
                            <span class="text-xs font-bold bg-purple-200 text-purple-900 px-2 py-1 rounded-lg">LEVEL 4</span>

        }

        function openMaterial(wulanganNum) {
            state.currentWulangan = wulanganNum;
            state.currentSubMaterial = 'A';
            navigate('material');
        }

        function startQuizFromMap() {
            if (state.currentQuestionIndex === undefined || state.currentQuestionIndex >= questionsData.length) {
                state.currentQuestionIndex = 0;
                state.score = 0;
                state.answers = {};
            }
            navigate('quiz');
        }

        function renderMaterialScreen() {
            const wData = materialsData[state.currentWulangan];
            const subKeys = Object.keys(wData.subs);
            const currentSub = wData.subs[state.currentSubMaterial];

                <div class="bg-white/95 backdrop-blur-md rounded-3xl shadow-2xl p-6 sm:p-8 border-4 border-amber-400">

                            🗺️ Bali menyang Peta

                    </div>

                    <div class="flex flex-wrap gap-2 mb-6">
                        ${subKeys.map(k => `

                        <p class="text-slate-800 text-base sm:text-lg leading-relaxed mb-4">${currentSub.content}</p>
                        
                        <div class="bg-white p-4 rounded-xl border border-amber-200 mt-4 flex items-start gap-3">
                            <span class="text-2xl">💡</span>
                            <div>
                                <h4 class="font-bold text-amber-900 text-sm">Cathetan Petualang Cilik (${state.studentName}):</h4>
                                <p class="text-slate-600 text-sm mt-1">Gatekna materine kanthi setiti sadurunge nerusake marang pitakon kuis supaya bijimu apik!</p>
                            </div>
                        </div>
                    </div>

                    <!-- Action Navigation -->
                    <div class="flex justify-between items-center">
                        <button onclick="navigate('map')" class="bg-slate-200 hover:bg-slate-300 text-slate-800 font-bold py-3 px-6 rounded-xl text-sm">

                        </button>
                        <button onclick="returnToQuiz()" class="bg-gradient-to-r from-orange-500 to-red-500 hover:from-orange-600 hover:to-red-600 text-white font-extrabold py-3 px-6 rounded-xl shadow text-sm flex items-center gap-2">

                    </div>
                </div>
            `;
        }

        function changeSubMaterial(subKey) {
            state.currentSubMaterial = subKey;
            render();

        function returnToQuiz() {
            navigate('quiz');
        }

        function renderQuizScreen() {
            const q = questionsData[state.currentQuestionIndex];
            const totalQ = questionsData.length;
            const progressPercent = ((state.currentQuestionIndex + 1) / totalQ) * 100;
            const selectedOpt = state.answers[state.currentQuestionIndex];
            const isAnswered = selectedOpt !== undefined;

            return `
                <div class="bg-white/95 backdrop-blur-md rounded-3xl shadow-2xl p-6 sm:p-8 border-4 border-amber-400">
                    <!-- Quiz Header -->
                    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-4 border-b pb-3 border-amber-200 gap-2">
                        <div>
                            <span class="text-xs font-bold bg-orange-200 text-orange-900 px-3 py-1 rounded-full">WULANGAN ${q.wulangan}</span>
                            <h2 class="text-lg sm:text-xl font-extrabold text-amber-900 mt-1">SOAL ${state.currentQuestionIndex + 1} SAKA ${totalQ}</h2>
                        </div>
                        <div class="flex items-center gap-4 text-sm font-bold text-amber-900">
                            <div>Petualang: <span class="text-orange-600">${state.studentName}</span></div>
                            <div class="bg-amber-100 px-3 py-1 rounded-xl border border-amber-300">Skor: <span class="text-emerald-600">${state.score}</span></div>
                        </div>
                    </div>

                    <!-- Progress Bar -->
                    <div class="w-full bg-amber-100 rounded-full h-3 mb-6 overflow-hidden border border-amber-300">
                        <div class="bg-gradient-to-r from-amber-500 to-orange-500 h-full transition-all duration-300" style="width: ${progressPercent}%"></div>
                    </div>

                    <!-- Question Box -->
                    <div class="bg-amber-50/70 border-2 border-amber-200 rounded-2xl p-5 sm:p-6 mb-6">
                        <p class="text-base sm:text-lg font-bold text-slate-900 mb-6">${q.question}</p>

                        <div class="grid grid-cols-1 gap-3">
                            ${q.options.map((opt, idx) => {
                                const optLetter = ['A', 'B', 'C', 'D'][idx];
                                let btnStyle = "bg-white hover:bg-amber-100 border-amber-300 text-slate-800";
                                if (isAnswered) {
                                    if (idx === q.answer) {
                                        btnStyle = "bg-emerald-500 text-white border-emerald-600 font-bold shadow-md";
                                    } else if (idx === selectedOpt && idx !== q.answer) {
                                        btnStyle = "bg-red-500 text-white border-red-600 font-bold shadow-md";
                                    } else {
                                        btnStyle = "bg-white text-slate-400 border-slate-200 opacity-60";
                                    }
                                }
                                return `
                                    <button ${isAnswered ? 'disabled' : `onclick="handleAnswer(${idx})"`} class="w-full text-left p-4 rounded-xl border-2 transition flex items-center gap-3 ${btnStyle}">
                                        <span class="w-8 h-8 rounded-lg bg-amber-200 text-amber-900 font-bold flex items-center justify-center text-sm">${optLetter}</span>
                                        <span class="text-sm sm:text-base">${opt}</span>
                                    </button>
                                `;
                            }).join('')}
                        </div>

                        <!-- Feedback Section -->
                        ${isAnswered ? `
                            <div class="mt-6 p-4 rounded-2xl border ${selectedOpt === q.answer ? 'bg-emerald-50 border-emerald-300 text-emerald-900' : 'bg-red-50 border-red-300 text-red-900'} animate-fade-in">
                                <div class="font-bold text-lg mb-1">
                                    ${selectedOpt === q.answer ? '✓ WANGSULAN BENER!' : '✗ DURUNG BENER'}
                                </div>
                                <p class="text-sm mb-2">
                                    ${selectedOpt === q.answer ? `Apik banget, ${state.studentName}!` : `Ora apa-apa, ${state.studentName}. Wangsulan sing bener yaiku: <span class="font-bold">${['A', 'B', 'C', 'D'][q.answer]}. ${q.options[q.answer]}</span>`}
                                </p>
                                <p class="text-xs italic text-slate-600 bg-white/60 p-2 rounded-lg border border-slate-200">
                                    ${q.explanation}
                                </p>
                            </div>
                        ` : ''}
                    </div>

                    <!-- Navigation Footer inside Quiz -->
                    <div class="flex flex-wrap justify-between items-center gap-3">
                        <button onclick="returnToMaterialFromQuiz()" class="bg-amber-100 hover:bg-amber-200 text-amber-900 font-bold py-3 px-5 rounded-xl text-sm border border-amber-300 flex items-center gap-2">
                            📚 BALIK MENYANG MATERI
                        </button>

                        <div class="flex gap-2">
                            ${state.currentQuestionIndex > 0 ? `
                                <button onclick="prevQuestion()" class="bg-slate-200 hover:bg-slate-300 text-slate-800 font-bold py-3 px-5 rounded-xl text-sm">
                                    &larr; Sadurunge
                                </button>
                            ` : ''}
                            
                            ${isAnswered ? `
                                <button onclick="nextQuestion()" class="bg-gradient-to-r from-orange-500 to-red-500 hover:from-orange-600 hover:to-red-600 text-white font-extrabold py-3 px-6 rounded-xl text-sm shadow">

                                </button>
                            ` : ''}
                        </div>
                    </div>
                </div>
            `;
        }

        function handleAnswer(optIdx) {
            const q = questionsData[state.currentQuestionIndex];
            state.answers[state.currentQuestionIndex] = optIdx;
            if (optIdx === q.answer) {
                state.score += 20; // 50 questions * 20 = 1000 max score
            }
            render();
        }

        function nextQuestion() {
            if (state.currentQuestionIndex < questionsData.length - 1) {
                state.currentQuestionIndex++;
                render();
            } else {
                navigate('result');
            }
        }

        function prevQuestion() {
            if (state.currentQuestionIndex > 0) {
                state.currentQuestionIndex--;
                render();
            }
        }

        function returnToMaterialFromQuiz() {
            const q = questionsData[state.currentQuestionIndex];
            state.currentWulangan = q.wulangan;
            state.currentSubMaterial = 'A';
            navigate('material');
        }

        function renderResultScreen() {
            let correctCount = 0;
            let incorrectCount = 0;
            Object.keys(state.answers).forEach(qIdx => {
                if (state.answers[qIdx] === questionsData[qIdx].answer) {
                    correctCount++;
                } else {
                    incorrectCount++;
                }
            });

            const finalScore = correctCount * 20;
            let badge = "💪 PEJUANG SINAU BASA JAWA";
            if (finalScore >= 800) badge = "🏆 JAGO BASA JAWA";
            else if (finalScore >= 500) badge = "🌟 PETUALANG BASA JAWA";

            return `
                <div class="bg-white/95 backdrop-blur-md rounded-3xl shadow-2xl p-6 sm:p-10 border-4 border-amber-400 text-center">
                    <div class="text-5xl sm:text-6xl mb-3">🎉🏆🎊</div>
                    <h2 class="text-2xl sm:text-4xl font-extrabold text-amber-900 mb-1">PETUALANGAN RAMPUNG!</h2>
                    <p class="text-lg font-bold text-amber-700 mb-6">Wilujeng, <span class="text-orange-600">${state.studentName}</span>!</p>

                    <div class="bg-amber-50 border-2 border-amber-200 rounded-3xl p-6 max-w-md mx-auto mb-6 shadow-inner">
                        <div class="text-sm font-bold text-amber-800 mb-1">SKOR AKHIR MU</div>
                        <div class="text-4xl sm:text-5xl font-extrabold text-orange-600 mb-4">${finalScore} <span class="text-lg text-slate-500">/ 1000</span></div>

                        <div class="grid grid-cols-2 gap-4 text-left border-t border-amber-200 pt-4">
                            <div class="bg-white p-3 rounded-xl border border-amber-100">
                                <div class="text-xs text-slate-500 font-bold">Wangsulan Bener</div>
                                <div class="text-xl font-extrabold text-emerald-600">${correctCount}</div>
                            </div>
                            <div class="bg-white p-3 rounded-xl border border-amber-100">
                                <div class="text-xs text-slate-500 font-bold">Wangsulan Salah</div>
                                <div class="text-xl font-extrabold text-red-600">${incorrectCount}</div>
                            </div>
                        </div>

                        <div class="mt-4 py-2 px-4 bg-amber-200 text-amber-900 font-extrabold rounded-xl text-sm shadow">
                            ${badge}
                        </div>
                    </div>

                    <div class="flex flex-col sm:flex-row justify-center gap-3">
                        <button onclick="navigate('certificate')" class="bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-700 hover:to-teal-700 text-white font-extrabold py-4 px-6 rounded-2xl shadow-lg flex items-center justify-center gap-2">
                            🏆 DELENG SERTIFIKAT DIGITAL
                        </button>

                        </button>
                    </div>
                </div>
            `;
        }

        function resetQuiz() {
            state.score = 0;
            state.currentQuestionIndex = 0;
            state.answers = {};
            navigate('quiz');
        }

        function renderCertificateScreen() {
            let correctCount = 0;
            Object.keys(state.answers).forEach(qIdx => {
                if (state.answers[qIdx] === questionsData[qIdx].answer) correctCount++;
            });
            const finalScore = correctCount * 20;
            const currentDate = new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });

            return `
                <div class="bg-white/95 backdrop-blur-md rounded-3xl shadow-2xl p-6 sm:p-10 border-4 border-amber-500 text-center relative overflow-hidden">
                    <div class="absolute -top-10 -left-10 text-7xl opacity-10">📜</div>
                    <div class="absolute -bottom-10 -right-10 text-7xl opacity-10">🌿</div>

                    <div class="border-4 border-double border-amber-600 p-6 sm:p-8 rounded-2xl bg-amber-50/50">
                        <div class="text-xs sm:text-sm font-extrabold text-amber-800 tracking-widest uppercase mb-1">Giga Inovation • Sertifikat Resmi</div>
                        <h2 class="text-2xl sm:text-4xl font-extrabold text-amber-900 mb-2 font-serif">SERTIFIKAT PANGHARGAAN</h2>
                        <p class="text-xs sm:text-sm text-slate-600 mb-6">Dipunparingaken dhumateng:</p>

                        <div class="text-2xl sm:text-4xl font-extrabold text-orange-600 border-b-2 border-amber-400 pb-2 mb-4 inline-block px-6">
                            ${state.studentName}
                        </div>

                        <p class="text-sm sm:text-base text-slate-700 leading-relaxed mb-6">
                            amargi kanthi mempeng sampun ngrampungake kabeh wulangan lan tantangan ing game edukatif:<br>
                            <strong class="text-amber-900 text-lg">"PETUALANGAN BASA JAWA KELAS 3"</strong>
                        </p>

                        <div class="flex justify-center gap-6 mb-6 text-sm font-bold text-amber-900">
                            <div class="bg-white p-3 rounded-xl border border-amber-200 shadow-sm">
                                Skor: <span class="text-orange-600">${finalScore} / 1000</span>
                            </div>
                            <div class="bg-white p-3 rounded-xl border border-amber-200 shadow-sm">
                                Bener: <span class="text-emerald-600">${correctCount} saka 50</span>
                            </div>
                        </div>

                        <div class="flex justify-between items-end border-t border-amber-300 pt-4 mt-4 text-xs text-slate-600">
                            <div>
                                <p class="font-bold text-amber-900">Tanggal:</p>
                                <p>${currentDate}</p>
                            </div>
                            <div>
                                <p class="font-bold text-amber-900">Developer:</p>
                                <p class="font-bold text-orange-600">Giga Inovation</p>
                                <p>Telp: 081329200985</p>
                            </div>
                        </div>
                    </div>

                    <div class="mt-6 flex flex-wrap justify-center gap-3">
                        <button onclick="window.print()" class="bg-amber-600 hover:bg-amber-700 text-white font-bold py-3 px-6 rounded-xl shadow text-sm">
                            🖨️ Cetak / Unduh Sertifikat
                        </button>
                        <button onclick="navigate('map')" class="bg-slate-200 hover:bg-slate-300 text-slate-800 font-bold py-3 px-6 rounded-xl shadow text-sm">
                            🗺️ Bali menyang Peta
                        </button>
                    </div>
                </div>
            `;
        }

        window.onload = function() {
            let counts = { 0: 0, 1: 0, 2: 0, 3: 0 };
            questionsData.forEach((q, idx) => {
                if (q.answer === undefined || q.answer < 0 || q.answer > 3) {
                    console.error(`Invalid question at index ${idx}`);
                }
                counts[q.answer]++;
            });
            console.log("Answer distribution verification (A, B, C, D):", counts);
            render();
        }
    </script>
</body>
</html>
